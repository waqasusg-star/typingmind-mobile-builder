# Source-only XcodeGen specification for QA Checklist iOS.
#
# The reviewed builder worker does not read this file: it generates its own controlled
# project spec and Info.plist before running xcodebuild. This spec exists so the
# delivered SOURCE ZIP can be rebuilt independently on a Mac:
#
#   xcodegen generate
#   open QabChecklist.xcodeproj   # then pick your own signing team
#
# It contains no credentials, entitlements, scripts or package dependencies.

name: QabChecklist

options:
  bundleIdPrefix: com.waqas
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"

targets:
  QabChecklist:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_NAME: QabChecklist
        PRODUCT_BUNDLE_IDENTIFIER: com.waqas.qabchecklistios
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        ENABLE_BITCODE: NO
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: QA Checklist
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
