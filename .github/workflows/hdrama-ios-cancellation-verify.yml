name: HDrama iOS cancellation verification
run-name: HDrama iOS 1.1.4 build 6 / ${{ github.sha }}
on:
  push:
    branches: [fix/hdrama-ios-cancellation-114]
permissions:
  contents: read
concurrency:
  group: native-ios-hdrama_ios-hdrama-ios-114-${{ github.run_id }}
  cancel-in-progress: false
env:
  PROJECT_ID: hdrama_ios
  REQUEST_ID: hdrama-ios-114-${{ github.run_id }}
  SOURCE_SHA: ${{ github.sha }}
  PYTHONUTF8: '1'
jobs:
  build:
    name: Compile and verify unsigned native iPhone IPA
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - name: Install XcodeGen from Homebrew
        run: command -v xcodegen || brew install xcodegen
      - name: Archive, analyze and verify device package
        run: python3 .builder/native_ios.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-iOS-hdrama_ios-hdrama-ios-114-${{ github.run_id }}
          path: native-output/
          retention-days: 14
          if-no-files-found: error
  publish:
    name: Preserve verified native IPA download
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/download-artifact@v4
        with:
          name: Native-iOS-hdrama_ios-hdrama-ios-114-${{ github.run_id }}
          path: native-release/
      - name: Publish verified unsigned native IPA
        run: python3 .builder/publish_native_ios.py
        env:
          GH_TOKEN: ${{ github.token }}
