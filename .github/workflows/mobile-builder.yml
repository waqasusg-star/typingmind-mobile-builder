name: Universal App Builder
run-name: Universal Builder / ${{ inputs.project_id }} / ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      project_id: {description: Project ID, required: true, type: string}
      platform: {description: Platform, required: true, type: choice, options: [android, ios, both, windows, extension, ios_unsigned]}
      request_id: {description: Unique request ID, required: true, type: string}
      source_sha: {description: Exact source commit, required: true, type: string}
permissions:
  contents: read
concurrency:
  group: mobile-builder-${{ inputs.project_id }}-${{ inputs.request_id }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  PROJECT_ID: ${{ inputs.project_id }}
  PLATFORM: ${{ inputs.platform }}
  REQUEST_ID: ${{ inputs.request_id }}
  SOURCE_SHA: ${{ inputs.source_sha }}
jobs:
  readiness:
    name: Check signing readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.check.outputs.android }}
      ios: ${{ steps.check.outputs.ios }}
      windows: ${{ steps.check.outputs.windows }}
      extension: ${{ steps.check.outputs.extension }}
      ios_unsigned: ${{ steps.check.outputs.ios_unsigned }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.source_sha }}', persist-credentials: false}
      - id: check
        run: python3 .builder/build.py readiness
        env:
          HAS_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
          HAS_APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: Build-Readiness-${{ inputs.request_id }}
          path: readiness/Build-Readiness.json
          retention-days: 14
  publish:
    name: Preserve verified app downloads
    needs: [android, ios, ios_unsigned, windows, extension]
    if: always() && (needs.android.result == 'success' || needs.ios.result == 'success' || needs.ios_unsigned.result == 'success' || needs.windows.result == 'success' || needs.extension.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/download-artifact@v4
        if: needs.android.result == 'success'
        with:
          name: Android-${{ inputs.project_id }}-${{ inputs.request_id }}
          path: release-input/android
      - uses: actions/download-artifact@v4
        if: needs.ios.result == 'success'
        with:
          name: iOS-${{ inputs.project_id }}-${{ inputs.request_id }}
          path: release-input/ios
      - uses: actions/download-artifact@v4
        if: needs.windows.result == 'success'
        with:
          name: Windows-${{ inputs.project_id }}-${{ inputs.request_id }}
          path: release-input/windows
      - uses: actions/download-artifact@v4
        if: needs.extension.result == 'success'
        with:
          name: Extension-${{ inputs.project_id }}-${{ inputs.request_id }}
          path: release-input/extension
      - uses: actions/download-artifact@v4
        if: needs.ios_unsigned.result == 'success'
        with:
          name: iOS-Unsigned-${{ inputs.project_id }}-${{ inputs.request_id }}
          path: release-input/ios_unsigned
      - name: Publish hash-checked packages and reports
        run: python3 .builder/publish.py
        env:
          GH_TOKEN: ${{ github.token }}
  ios_unsigned:
    name: Unsigned iPhone device IPA - sign before install
    needs: readiness
    if: needs.readiness.outputs.ios_unsigned == 'true'
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.source_sha }}', persist-credentials: false}
      - name: Install Flutter stable
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Analyze, test and export unsigned device IPA
        run: python3 .builder/ios_unsigned.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-Unsigned-${{ inputs.project_id }}-${{ inputs.request_id }}
          path: output/
          if-no-files-found: error
          retention-days: 14
  android:
    name: Android signed APK
    needs: readiness
    if: needs.readiness.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.source_sha }}', persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Install Flutter stable
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Analyze, test, build and verify signed APK
        run: python3 .builder/build.py android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-${{ inputs.project_id }}-${{ inputs.request_id }}
          path: output/
          if-no-files-found: error
          retention-days: 14
  ios:
    name: iOS signed IPA
    needs: readiness
    if: needs.readiness.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.source_sha }}', persist-credentials: false}
      - name: Install Flutter stable
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Analyze, test, build and verify signed IPA
        run: python3 .builder/build.py ios
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-${{ inputs.project_id }}-${{ inputs.request_id }}
          path: output/
          if-no-files-found: error
          retention-days: 14
  windows:
    name: Windows installer and portable app
    needs: readiness
    if: needs.readiness.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.source_sha }}', persist-credentials: false}
      - name: Install Flutter stable
        shell: pwsh
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$env:RUNNER_TEMP/flutter"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP/flutter/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Analyze, test, build, install and launch
        run: python .builder/windows.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-${{ inputs.project_id }}-${{ inputs.request_id }}
          path: output/
          if-no-files-found: error
          retention-days: 14
  extension:
    name: Chrome extension package and Chromium tests
    needs: readiness
    if: needs.readiness.outputs.extension == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ inputs.source_sha }}', persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install pinned Chromium test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/extension-tools" playwright@1.56.1 --no-audit --no-fund
          "$RUNNER_TEMP/extension-tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/extension-tools/node_modules" >> "$GITHUB_ENV"
      - name: Validate, test and package extension
        run: python3 .builder/extension.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Extension-${{ inputs.project_id }}-${{ inputs.request_id }}
          path: output/
          if-no-files-found: error
          retention-days: 14
